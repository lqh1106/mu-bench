[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mubench"
version = "1.0.0"
authors = [{name = "Lin Qihao"}]
description = "Multi-user full-duplex shared-assistant benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0; third-party components retain their licenses"}
dependencies = [
  "pydantic>=2.10,<3", "numpy>=1.26,<3", "scipy>=1.10", "soundfile>=0.12",
  "websockets>=12,<13", "loguru>=0.7", "requests>=2.31", "httpx>=0.27",
  "tenacity>=8", "python-dotenv>=1", "PyYAML>=6", "rich>=13", "docstring-parser>=0.16",
  "litellm>=1.80.15,<1.82.7", "deepdiff>=8", "addict>=2.4", "toml>=0.10",
  "huggingface-hub>=0.24", "pandas>=2", "tabulate>=0.9", "psutil>=5", "pydub>=0.25", "jiwer>=3",
  "aiohttp>=3.9", "tqdm>=4", "typer>=0.12"
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8"]

[project.scripts]
mubench = "mubench.cli:main"

[tool.setuptools]
packages = ["mubench"]
